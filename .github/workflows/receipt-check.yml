# Reusable receipt check, called by every org repository's gate-policy.yml on
# pull_request_target. It checks out gate-policy's own tree at the very commit
# the caller resolved for this workflow (github.job_workflow_sha; never the
# caller's PR code) and reads the pull request through the API with the
# caller's read-only token. Design: claude-config, spec 2026-09-27, part B.
name: receipt-check
on:
  workflow_call:
permissions:
  contents: read
  pull-requests: read
  statuses: read
jobs:
  receipt-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out gate-policy at the resolved workflow commit (the policy, not the caller)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: exigo-AI-Studio/gate-policy
          ref: ${{ github.job_workflow_sha }}
          persist-credentials: false
      - name: Verify the pull request carries a fresh, clean gate receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_receipt.py
