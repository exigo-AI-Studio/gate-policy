name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -t . -v
      - run: |
          if ls scripts/*.sh >/dev/null 2>&1; then shellcheck scripts/*.sh; else echo "no shell files"; fi
