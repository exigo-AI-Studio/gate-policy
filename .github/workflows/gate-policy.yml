# Same caller file every org repository carries, here on pull_request so the
# context name GitHub reports for the reusable job can be measured in this
# repository's own PRs (plan task 0, step 5).
name: gate-policy
on:
  pull_request:
permissions:
  contents: read
  pull-requests: read
  statuses: read
jobs:
  receipt-check:
    uses: exigo-AI-Studio/gate-policy/.github/workflows/receipt-check.yml@v1
